name: Deploy contact Worker

on:
  push:
    branches: [source]
    paths:
      - src/email-system/cloudflare/**
      - .github/workflows/contact-worker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contact-worker-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
      - name: Deploy Worker
        run: bunx wrangler@4.128.0 deploy --config src/email-system/cloudflare/wrangler.jsonc
