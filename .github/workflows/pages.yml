name: Build and publish website

on:
  pull_request:
    branches: [source]
  push:
    branches: [source, main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: website-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref_name == 'source'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lune
        run: |
          curl -fsSL https://github.com/lune-org/lune/releases/download/v0.10.4/lune-0.10.4-linux-x86_64.zip -o lune.zip
          unzip -q lune.zip lune
          chmod +x lune
          sudo mv lune /usr/local/bin/lune
      - name: Validate localization
        run: lune run i18n/validate.luau
      - name: Test publication
        run: lune run src/website/scripts/publish_test.luau
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: generated-main
          path: .heap/repo-branches/main
          include-hidden-files: true

  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == 'source'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: generated-main
          path: .heap/generated-main
      - name: Update main branch
        run: |
          git worktree add -B main .heap/main-worktree origin/main
          rsync -a --delete --exclude=.git .heap/generated-main/ .heap/main-worktree/
          cd .heap/main-worktree
          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Publish website from source'
            git push origin main
          fi
      - name: Trigger deployment from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

  deploy:
    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
