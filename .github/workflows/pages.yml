name: Publish website

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-publication
  cancel-in-progress: false

jobs:
  validate:
    name: 01 · Validate source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lune
        run: |
          curl -fsSL https://github.com/lune-org/lune/releases/download/v0.10.4/lune-0.10.4-linux-x86_64.zip -o lune.zip
          unzip -q lune.zip lune
          chmod +x lune
          sudo mv lune /usr/local/bin/lune
      - uses: oven-sh/setup-bun@v2
      - name: Validate localization catalogs
        run: lune run i18n/validate.luau
      - name: Check Worker syntax
        run: bun build src/email-system/cloudflare/contact.js --target browser --outfile /tmp/contact-worker.js

  build:
    name: 02 · Assemble website
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lune
        run: |
          curl -fsSL https://github.com/lune-org/lune/releases/download/v0.10.4/lune-0.10.4-linux-x86_64.zip -o lune.zip
          unzip -q lune.zip lune
          chmod +x lune
          sudo mv lune /usr/local/bin/lune
      - name: Build single website
        run: lune run src/website/scripts/build_site.luau
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: website-pages
          path: .heap/pages

  deploy_website:
    name: 03 · Deploy website
    needs: build
    if: github.event_name != 'pull_request' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website-pages
          path: .heap/pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .heap/pages
      - id: deployment
        uses: actions/deploy-pages@v4
