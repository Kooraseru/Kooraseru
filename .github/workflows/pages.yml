name: Build and deploy site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lune
        run: |
          curl -fsSL https://github.com/lune-org/lune/releases/download/v0.10.4/lune-0.10.4-linux-x86_64.zip -o lune.zip
          unzip -q lune.zip lune
          chmod +x lune
          sudo mv lune /usr/local/bin/lune
      - name: Generate and verify project catalog
        run: |
          lune run src/scripts/build_projects.luau
          lune run src/scripts/build_projects.luau --check
      - name: Assemble site
        run: |
          mkdir -p dist
          cp -R src/index.html src/css src/js src/i18n src/gcloud src/mod-mail src/confetti-types.json src/projects.json dist/
          cp -R assets dist/assets
          cp CNAME dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
